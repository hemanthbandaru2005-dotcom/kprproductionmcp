  <script>
    // Samsung Internet & Android Chromium Force-Dark Runtime Killer
    // Samsung's dark mode engine operates at the RENDER PIPELINE level, after CSS.
    // Only inline styles set via JavaScript can override it reliably.
    (function() {
      var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (!isDark) return;

      // Color map: className substring -> intended background color
      var colorMap = {
        'bg-[#F7F3EE]': '#F7F3EE',
        'bg-[#FAF8F5]': '#FAF8F5',
        'bg-[#FAF7F2]': '#FAF7F2',
        'bg-[#FDFBF7]': '#FDFBF7',
        'bg-[#FAF6F0]': '#FAF6F0',
        'bg-[#FAF7F2]/95': 'rgba(250,247,242,0.95)',
        'bg-white': '#FFFFFF',
        'bg-[#0D0B08]': '#0D0B08',
        'bg-[#07090D]': '#07090D',
        'bg-[#0A0A0A]': '#0A0A0A',
        'bg-[#11100F]': '#11100F',
        'bg-[#111111]': '#111111',
        'bg-[#1A1A1A]': '#1A1A1A',
        'bg-[#1A1816]': '#1A1816',
        'bg-[#151515]': '#151515',
        'bg-[#121212]': '#121212',
        'bg-black': '#000000'
      };

      // Text color map
      var textMap = {
        'text-[#1A1A1A]': '#1A1A1A',
        'text-[#222222]': '#222222',
        'text-[#333333]': '#333333',
        'text-[#444444]': '#444444',
        'text-[#555555]': '#555555',
        'text-[#666666]': '#666666',
        'text-white': '#FFFFFF',
        'text-[#C5A880]': '#C5A880',
        'text-[#E8D4B8]': '#E8D4B8'
      };

      // Border color map
      var borderMap = {
        'border-[#E2D9CC]': '#E2D9CC',
        'border-[#D8CFC4]': '#D8CFC4',
        'border-[#C5A880]': '#C5A880'
      };

      function forceColors(root) {
        if (!root || !root.querySelectorAll) return;
        var all = root.querySelectorAll('*');
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          var cls = el.className;
          if (typeof cls !== 'string') continue;

          // Force background colors
          for (var bgKey in colorMap) {
            if (cls.indexOf(bgKey) !== -1) {
              el.style.setProperty('background-color', colorMap[bgKey], 'important');
              break;
            }
          }

          // Force text colors
          for (var txtKey in textMap) {
            if (cls.indexOf(txtKey) !== -1) {
              el.style.setProperty('color', textMap[txtKey], 'important');
              break;
            }
          }

          // Force border colors
          for (var bdrKey in borderMap) {
            if (cls.indexOf(bdrKey) !== -1) {
              el.style.setProperty('border-color', borderMap[bdrKey], 'important');
              break;
            }
          }
        }

        // Always force body & html
        document.documentElement.style.setProperty('background-color', '#F7F3EE', 'important');
        document.body.style.setProperty('background-color', '#F7F3EE', 'important');
        document.body.style.setProperty('color', '#1A1A1A', 'important');
      }

      // Run on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { forceColors(document); });
      } else {
        forceColors(document);
      }

      // Re-run after React hydrates (React typically renders within 1-3 seconds)
      setTimeout(function() { forceColors(document); }, 500);
      setTimeout(function() { forceColors(document); }, 1500);
      setTimeout(function() { forceColors(document); }, 3000);

      // MutationObserver: catch React's dynamic DOM updates
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          if (m.addedNodes && m.addedNodes.length) {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var node = m.addedNodes[j];
              if (node.nodeType === 1) forceColors(node.parentElement || document);
            }
          }
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
